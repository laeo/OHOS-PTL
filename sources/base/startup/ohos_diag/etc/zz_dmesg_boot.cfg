{
    "services" : [{
            "name" : "zz_dmesg_boot",
            "path" : ["/system/bin/sh", "/system/bin/zz_dmesg_boot.sh"],
            "start-mode" : "boot",
            "disabled" : 0,
            "once" : 1,
            "sandbox" : 0,
            "uid" : "root",
            "gid" : ["root", "shell"],
            "secon" : "u:r:console:s0",
            "caps" : [
                "SYSLOG"
            ],
            "apl" : "system_core",
            "permission" : [
                "ohos.permission.DUMP"
            ],
            "permission_acls" : [
                "ohos.permission.DUMP"
            ]
        }
    ]
}
