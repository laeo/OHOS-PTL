{
    "jobs" : [{
            "name" : "reboot",
            "cmds" : [
                "syncexec /system/bin/sh /system/bin/zz_diag_shutdown.sh"
            ]
        }
    ],
    "services" : [{
            "name" : "zzdiagboot",
            "path" : ["/system/bin/sh", "/system/bin/zz_diag_boot.sh"],
            "start-mode" : "boot",
            "disabled" : 0,
            "once" : 1,
            "sandbox" : 0,
            "uid" : "root",
            "gid" : ["root", "shell"],
            "secon" : "u:r:console:s0",
            "apl" : "system_core",
            "permission" : [
                "ohos.permission.DUMP"
            ],
            "permission_acls" : [
                "ohos.permission.DUMP"
            ]
        }
    ]
}
