{
    "jobs" : [{
            "name" : "post-init",
            "cmds" : [
                "start zz_audio",
                "start zz_audioguard"
            ]
        }
    ],
    "services" : [{
            "name" : "zz_audio",
            "path" : ["/system/bin/sh", "/system/bin/zz_audioup.sh"],
            "start-mode" : "boot",
            "disabled" : 0,
            "once" : 1,
            "sandbox" : 0,
            "uid" : "root",
            "gid" : ["root", "shell"],
            "secon" : "u:r:console:s0"
        },
        {
            "name" : "zz_audioguard",
            "path" : ["/system/bin/sh", "/system/bin/zz_audioguard.sh"],
            "start-mode" : "boot",
            "disabled" : 0,
            "once" : 0,
            "sandbox" : 0,
            "uid" : "root",
            "gid" : ["root", "shell"],
            "secon" : "u:r:console:s0"
        }
    ]
}
