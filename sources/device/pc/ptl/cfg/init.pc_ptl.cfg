{
    "import" : [
            "init.${ohos.boot.hardware}.usb.cfg"
    ],
    "jobs" : [{
            "name" : "pre-init",
            "cmds" : [
                "write /proc/sys/vm/min_free_kbytes 10240",
                "mount debugfs /sys/kernel/debug /sys/kernel/debug mode=755",
                "chmod 0666 /dev/kmsg"
            ]
        }, {
            "name" : "init",
            "cmds" : [
                "syncexec /system/bin/sh /system/bin/zz_drmmod.sh",
                "start hdf_devmgr"
            ]
        }, {
            "name" : "param:bootevent.hdf_devmgr.ready",
            "condition" : "bootevent.hdf_devmgr.ready=true",
            "cmds" : [
                "start composer_host"
            ]
        }, {
            "name" : "boot",
            "cmds" : [
                "chmod 666 /dev/dri/card0",
                "chown system graphics /dev/dri/card0",
                "chmod 666 /dev/dri/card1",
                "chown system graphics /dev/dri/card1",
                "chmod 666 /dev/dri/renderD128",
                "chown system graphics /dev/dri/renderD128",
                "setparam persist.hdc.mode tcp",
                "setparam persist.hdc.port 5555"
            ]
        }
    ],
    "services" : []
}
