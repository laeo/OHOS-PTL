{
    "jobs" : [{
            "name" : "boot",
            "cmds" : [
                "start ohosshd"
            ]
        }
    ],
    "services" : [{
            "name" : "ohosshd",
            "path" : ["/system/bin/ohosshd"],
            "uid" : "root",
            "gid" : ["root"],
            "once" : 0,
            "disabled" : 1,
            "critical" : 0,
            "secon" : "u:r:su:s0"
        }
    ]
}
